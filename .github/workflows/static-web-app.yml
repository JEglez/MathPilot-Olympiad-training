# GitHub Actions workflow — MathPilot frontend deployment to Azure Static Web Apps
#
# Required GitHub Secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  — deployment token from the Static Web App resource
#     Retrieve with:
#       az staticwebapp secrets list --name <swa-name> --query "properties.apiKey" -o tsv
#
# Optional GitHub Secrets:
#   VITE_API_BASE_URL  — override the API base URL (e.g. https://omm-mathpilot-api.azurewebsites.net/api)
#                        Defaults to /api (proxied through SWA's linked Functions app)
#
# Architecture reference: docs/plan/02-mvp-architecture.md §3.7

name: Deploy web app

on:
  push:
    branches:
      - main
      - phase-5-frontend
    paths:
      - "apps/web/**"
      - ".github/workflows/static-web-app.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "apps/web/**"
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Skip the deploy step on PR close (SWA handles preview environment cleanup)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "apps/web"
          output_location: "dist"
          skip_app_build: true

  close_pull_request:
    name: Close PR environment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
