# GitHub Actions workflow — Olympiad problem ingestion
# Trigger manually: Actions tab → "Ingestion" → Run workflow
# See architecture-principles.md §11 for operational script rules

name: Ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Dataset to import'
        type: choice
        options: [all, omni-math, olympiad-bench, olympmath, numina-math]
        default: all
      dry_run:
        description: 'Dry run (fetch + parse only, no DB writes)'
        type: boolean
        default: true
      run_migrations:
        description: 'Run DB migrations 001–004 (first run only)'
        type: boolean
        default: false
      seed_taxonomy:
        description: 'Load taxonomy seed data (first run only)'
        type: boolean
        default: false
      reclassify_only:
        description: 'Re-classify only — update problems with NULL proof_style (no re-fetch, no re-embed)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h — Batch API can take hours

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            scripts/ingestion/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install script dependencies
        run: npm ci
        working-directory: scripts/ingestion

      # ── Optional: DB setup (first run only) ────────────────────────────────

      - name: Install PostgreSQL client
        if: inputs.run_migrations || inputs.seed_taxonomy
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run DB migrations (001–004)
        if: inputs.run_migrations
        run: |
          for f in db/migrations/001_create_taxonomy.sql \
                   db/migrations/002_create_problems.sql \
                   db/migrations/003_create_join_tables.sql \
                   db/migrations/004_create_import_tables.sql; do
            echo "  Running $f"
            psql "$MATHPILOT_DB_URL" -f "$f" -v ON_ERROR_STOP=1
          done
          echo "Migrations complete (005_create_search_indexes.sql runs after bulk import)"
        env:
          MATHPILOT_DB_URL: ${{ secrets.MATHPILOT_DB_URL }}

      - name: Load taxonomy seed data
        if: inputs.seed_taxonomy
        run: |
          for f in topics subtopics techniques competitions; do
            echo "  Seeding $f"
            psql "$MATHPILOT_DB_URL" -f "db/seed/$f.sql" -v ON_ERROR_STOP=1
          done
          echo "Seed data loaded"
        env:
          MATHPILOT_DB_URL: ${{ secrets.MATHPILOT_DB_URL }}

      # ── Ingestion ───────────────────────────────────────────────────────────

      - name: Run ingestion
        run: npx tsx run.ts
        working-directory: scripts/ingestion
        env:
          MATHPILOT_DB_URL:               ${{ secrets.MATHPILOT_DB_URL }}
          MATHPILOT_OPENAI_ENDPOINT:      ${{ secrets.MATHPILOT_OPENAI_ENDPOINT }}
          MATHPILOT_OPENAI_API_KEY:       ${{ secrets.MATHPILOT_OPENAI_API_KEY }}
          MATHPILOT_CLASSIFICATION_MODEL: ${{ secrets.MATHPILOT_CLASSIFICATION_MODEL }}
          MATHPILOT_EMBEDDING_MODEL:      ${{ secrets.MATHPILOT_EMBEDDING_MODEL }}
          IMPORT_SOURCE:                  ${{ inputs.source }}
          DRY_RUN:                        ${{ inputs.dry_run }}
          RECLASSIFY_ONLY:                ${{ inputs.reclassify_only }}

      # ── Optional: post-import search indexes (run after first full import) ──

      - name: Create search indexes (005)
        if: ${{ !inputs.dry_run && inputs.run_migrations }}
        run: |
          echo "Creating HNSW + GIN indexes (this may take several minutes)..."
          psql "$MATHPILOT_DB_URL" -f "db/migrations/005_create_search_indexes.sql" -v ON_ERROR_STOP=1
          echo "Search indexes created"
        env:
          MATHPILOT_DB_URL: ${{ secrets.MATHPILOT_DB_URL }}

