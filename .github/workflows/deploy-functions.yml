# GitHub Actions workflow — MathPilot Azure Functions API deployment
#
# Required GitHub Secrets:
#   AZURE_FUNCTIONAPP_PUBLISH_PROFILE  — publish profile XML from the Functions App
#   MATHPILOT_DB_URL                   — postgresql://... connection string
#   MATHPILOT_OPENAI_ENDPOINT          — https://omm-mathpilot-openai.openai.azure.com/
#   MATHPILOT_OPENAI_API_KEY           — Azure OpenAI key
#   MATHPILOT_EMBEDDING_MODEL          — text-embedding-3-small
#   MATHPILOT_CLASSIFICATION_MODEL     — gpt-5-mini (used as chat model too)

name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy Azure Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Configure app settings
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Function App settings
        run: |
          az functionapp config appsettings set \
            --name omm-mathpilot-api \
            --resource-group rg-omm \
            --settings \
              MATHPILOT_DB_URL="${{ secrets.MATHPILOT_DB_URL }}" \
              MATHPILOT_OPENAI_ENDPOINT="${{ secrets.MATHPILOT_OPENAI_ENDPOINT }}" \
              MATHPILOT_OPENAI_KEY="${{ secrets.MATHPILOT_OPENAI_API_KEY }}" \
              MATHPILOT_EMBEDDING_MODEL="${{ secrets.MATHPILOT_EMBEDDING_MODEL }}" \
              MATHPILOT_CHAT_MODEL="${{ secrets.MATHPILOT_CLASSIFICATION_MODEL }}" \
            --output none

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: omm-mathpilot-api
          package: functions
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: false
          respect-funcignore: true
